<body style="margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; background: #231F20;">
    <div class="alert">
        <span class="closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
        Want to play tetris? <a href="https://goldenn.dev/tetris/">Click here!</a> New games coming soon!
    </div>
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100%; height: 100%; margin: 0;"></div>
    </div>
    <div id="dupPanel" style="position:fixed;top:60px;right:10px;z-index:10;background:rgba(0,0,0,.65);color:#fff;font:14px sans-serif;padding:8px 10px;border-radius:6px;">
        <label style="cursor:pointer"><input id="spamToggle" type="checkbox"> Spam Enter</label>
        every <input id="spamMs" type="number" min="0" max="1000" value="5" style="width:45px">ms &times;<input id="spamBurst" type="number" min="1" max="50" value="3" style="width:40px">/tick
    </div>
    <script>
        // Turns the "spam Enter" map-duplication glitch into a feature:
        // a toggle that keeps sending Enter key presses to the game.
        (function () {
            function pressEnter() {
                var targets = [document.querySelector("#gameContainer canvas"), document, window];
                ["keydown", "keypress", "keyup"].forEach(function (type) {
                    var ev = new KeyboardEvent(type, { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true, cancelable: true });
                    // Unity 2018 reads keyCode/which off the event; make sure they are set
                    try { Object.defineProperty(ev, "keyCode", { get: function () { return 13; } }); Object.defineProperty(ev, "which", { get: function () { return 13; } }); } catch (e) {}
                    var t = targets[0] || document;
                    t.dispatchEvent(ev);
                });
            }

            // Toggle: keeps pressing Enter repeatedly until switched off
            var spamBox = document.getElementById("spamToggle");
            var spamTimer = null;
            spamBox.addEventListener("change", function () {
                spamBox.blur();
                if (spamBox.checked) {
                    var ms = Math.max(0, parseInt(document.getElementById("spamMs").value, 10) || 0);
                    var burst = Math.max(1, parseInt(document.getElementById("spamBurst").value, 10) || 1);
                    spamTimer = setInterval(function () { for (var k = 0; k < burst; k++) pressEnter(); }, ms);
                } else {
                    clearInterval(spamTimer);
                    spamTimer = null;
                }
            });
        })();

        // Make the game re-measure its container (after load, and when the banner is closed)
        function refit() { window.dispatchEvent(new Event("resize")); }
        window.addEventListener("load", function () { [500, 2000, 5000].forEach(function (t) { setTimeout(refit, t); }); });
        document.querySelector(".closebtn").addEventListener("click", function () { setTimeout(refit, 50); });
    </script>
